version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    tty: true
    ports:
      - "3306:3306"
    networks:
      local-net:
        aliases:
          - mysql
    environment:
      TZ: America/New_York
      LANG: C.UTF_8
      MYSQL_ROOT_PASSWORD: root
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - db:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - local-net
    env_file:
      - ./backend/envs/.env
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - data:/redis

  rq_worker:
    build:
      context: backend
      dockerfile: rqworker.Dockerfile
    container_name: rq_worker
    env_file:
      - ./backend/envs/.env
    networks:
      - local-net
    depends_on:
      - redis
      - mysql

  fastapi:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512m"
    env_file:
      - ./backend/envs/.env
    build:
      context: backend
      dockerfile: fastapi.Dockerfile
    container_name: fastapi
    ports:
      - ${PORT:-8000}:${PORT:-8000}
    networks:
      local-net:
        aliases:
          - fastapi
    volumes:
      - logs:/code/backend/logs
    depends_on:
      - rq_worker

networks:
  local-net:
    driver: bridge

volumes:
  data:
    driver: local
  logs:
    external: true
  db:
    driver: local
