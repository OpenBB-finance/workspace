[tool:pytest]
testpaths =
    backend/tests
markers =
    integration: Integration tests for the pro platform
addopts = --cov=main --cov=api --cov=utilities --cov=routers --cov=utilities --cov-report=html
asyncio_mode = auto
filterwarnings = ignore::pytest_mock.PytestMockWarning
env =
    MAILCHIMP=badkey
    JOSESECRET=secretkey
    FRONTENDURL=http://127.0.0.1
    ADMIN_PASSWORD=jose
    READ_DB_USER=root
    READ_DB_PASSWORD=root
    WRITE_DB_USER=root
    WRITE_DB_PASSWORD=root
    DB_HOST=localhost
    DB_PORT=3360
    DB_NAME=sample_db
    D:OPENBB_CHARGEBEE_SITE_KEY=BADKEY
    D:OPENBB_CHARGEBEE_API_KEY=BADKEYA
    MODE=test
    REDIS_HOST=localhost
    REDIS_PASS=
    REDIS_PORT=6379
    REDIS_DB=0
    OPENBB_FRONTEND_USER_AGENT=testclient
    D:OPENBB_GEO_KEY=testkey
    MAILCHIMP_MARKETING
    MAILCHIMP_TRANSACTIONAL
    MAILCHIMP_SERVER
    MAILCHIMP_AUDIENCE_ID
    S3_ACCESS_KEY
    S3_SECRET_KEY
    S3_BUCKET_NAME
    OPENBB_AES_KEY
    POLYGON_KEY=BADKEY
    FMP_KEY=BADKEY
    OPENAI_KEY=BADKEY
    NIXTLA_KEY=BADKEY
    HUBSPOT_EMAIL_TOKEN=BADKEY
    HUBSPOT_CONTACT_TOKEN=BADKKEY
    HUBSPOT_SERVICE_TOKEN=BADKEY
    PROURL=http://localhost:1420
    SELFURL=http://localhost:8000

[codespell]
skip = ./tests,.git,*.css,*.csv,*.ini,*.ipynb,*.js,*.json,*.lock,*.scss,*.txt,*.yaml,*/patches/*,*/all_tickers.ts,*/node_modules,./.github,./frontend/app/content/register.ts,./htmlcov,./backend/htmlcov
quiet-level = 2
ignore-words-list = statics,propage,hsi,gard,zlot,ore,mis,shat
