services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    tty: true
    ports:
      - "5432:5432"
    networks:
      local-net:
        aliases:
          - postgres
    environment:
      TZ: America/New_York
      POSTGRES_USER: openbb_user
      POSTGRES_PASSWORD: openbb_password_123
      POSTGRES_DB: openbb_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbb_user -d openbb_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - pg_db:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - local-net
    env_file:
      - ./backend/envs/.env
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - data:/redis

  fastapi:
    build:
      context: backend
      dockerfile: fastapi.Dockerfile
    container_name: fastapi
    env_file:
      - ./backend/envs/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_TYPE: postgresql
      REDIS_HOST: redis
    command:
      [
        "sh",
        "-c",
        "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /opt/code",
      ]
    ports:
      - "8000:8000"
    networks:
      local-net:
        aliases:
          - fastapi
    volumes:
      - ./backend:/opt/code
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rq_worker:
    build:
      context: backend
      dockerfile: rqworker.Dockerfile
    container_name: rq_worker
    env_file:
      - ./backend/envs/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_TYPE: postgresql
      REDIS_HOST: redis
    networks:
      - local-net
    volumes:
      - ./backend:/opt/code
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /opt/code
          ignore:
            - .git/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - htmlcov/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  local-net:
    driver: bridge

volumes:
  data:
    driver: local
  pg_db:
    driver: local
