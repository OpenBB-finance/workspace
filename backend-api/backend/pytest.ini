[pytest]
markers =
    integration: Integration tests for the pro platform
asyncio_mode = auto
env =
    MODE=test
    DATABASE_TYPE=mysql
    DB_HOST=127.0.0.1
    DB_PORT=3307
    DB_NAME=test_db
    DB_USER=root
    DB_PASSWORD=test_password
    WRITE_DB_USER=root
    WRITE_DB_PASSWORD=test_password
    READ_DB_USER=root
    READ_DB_PASSWORD=test_password
    REDIS_HOST=127.0.0.1
    REDIS_PORT=6380
    REDIS_DB=0
    
    # Required fake values for Pydantic validation
    REDIS_PASS=
    PROURL=http://localhost:3000
    SELFURL=http://localhost:8000
    JWT_SECRET=supersecretkeyfortestingonly12345
    OPENBB_AES_KEY=sixteenbytekey!!
    
    # Disable CORS origin checks for tests (fixes 401s from OpenBBOriginOAuth2Token)
    DISABLE_CORS=True
