[build-system]
requires = ["poetry-core>=2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["OpenBB Team <hello@openbb.co>"]
package-mode = false

[tool.poetry.dependencies]
python = "~3.13"
fastapi = "^0.141.1"
starlette = "^1.6.0"
azure-storage-blob = "^12.28.0"
azure-identity = "^1.25.0"
SQLAlchemy = "^2.0.50"
pytz = "^2025.2.0"
SQLAlchemy-Utils = "^0.42.1"
requests = "^2.34.2"
alembic = "^1.18.4"
bcrypt = "^4.1"
python-multipart = "^0.0.32"
email-validator = "^2.3.0"
aiomysql = "0.3.2"
PyMySQL = "^1.2.0"
rq = "^1.16.2"
redis = "^7.1.0"
pydantic = "^2.12.5"
gunicorn = "^26.0.0"
uvicorn = "^0.52.3"
uvicorn-worker = "^0.4.0"
loguru = "^0.7.3"
fastapi-pagination = "^0.15.16"
slowapi = { git = "https://github.com/laurentS/slowapi", branch = "master" }
prometheus-fastapi-instrumentator = "^8.0.0"
pydantic-settings = "^2.15.0"
python-slugify = "^8.0"
hubspot-api-client = "^12.0.0"
pyotp = "^2.9"
cryptography = "^50.0.0"
pyjwt = "2.13.0"
aiohttp = "^3.14.3"
tornado = "^6.5.7"
h11 = "^0.16.0"
mailchimp-transactional = "^1.3.3"
mailchimp-marketing = "^3.0.80"
wheel = "^0.46.3"
httpx = "^0.28.1"
idna = "^3.18"
certifi = "^2026.5.20"
aioboto3 = "^15.5.0"
greenlet = "^3.5.1"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.10"
aiosqlite = "^0.22.0"
fastmcp = "^3.4.6"
openbb-ai = "^2.1.0"

# This is still needed for old_aes script and util to work
# and should be removed once the issue is resolved
pycryptodome = "^3.23.0"


[tool.poetry.group.dev.dependencies]
vcrpy = { version = ">=8.3.0", markers = "platform_python_implementation == 'CPython'" }
pytest = "^9.0.3"
pytest-mock = "^3"
pytest-vcr = "^1"
pytest-env = "^1"
pytest-asyncio = "^1.3.0"
testcontainers = { version = "^4.8", extras = ["mysql", "postgres", "redis"] }
types-pymysql = "^1"
types-pytz = "^2024"
types-cachetools = "^5"
ty = "^0.0.15"
ruff = "^0.15.6"

[tool.ruff]
line-length = 122
target-version = "py312"

[tool.ruff.lint]
ignore = ["S311", "PLW1514", "PLW0717", "UP040", "UP046", "UP047"]
select = [
    "E",
    "W",
    "F",
    "Q",
    "W",
    "S",
    "UP",
    "I",
    "PD",
    "SIM",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "T20",
    "PYI",
]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",
    "I001",
    "PLC0415",
    "PLC2701",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLR6301",
    "S101",
    "S105",
    "S106",
    "S110",
    "S311",
    "S404",
    "S608",
    "SIM105",
]
"tests/stress/*" = ["T201", "PLR0914", "PLR0915"]
"tests/test_bridge_load.py" = ["T201", "PLR0914", "PLR0915"]
"alembic/versions/*" = ["E501", "Q000"]
"alembic/versions_archive/*" = ["E501", "Q000"]
"alembic/*" = ["SIM105"]
"*/__init__.py" = ["F401"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
